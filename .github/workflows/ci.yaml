name: "CI Pipeline"
# This CI workflow triggers on new PR or push on main branch.
# Todo: Using this wireframe, build the final pipeline

# This should be the original event outline
# on:
#   pull_request:
#     branches:
#       - main
#   push:
#     branches:
#       - main

# This is a test event outline for testing CI on test branch.

on:
  push:
    branches:
      - github_actions

jobs:
  test:
    name: "Test"
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: "Install Docker Compose"
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Build docker images
      - name: Build and Run Docker Images
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          IS_DEV: ${{ secrets.IS_DEV }}
          DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DEV_DB_USER: ${{ secrets.DEV_DB_USER }}
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DEV_DB_HOST: ${{ secrets.DEV_DB_HOST }}
          DEV_DB_PORT: ${{ secrets.DEV_DB_PORT }}
          DEV_SUPERUSER_EMAIL: ${{ secrets.DEV_SUPERUSER_EMAIL }}
          DEV_SUPERUSER_USERNAME: ${{ secrets.DEV_SUPERUSER_USERNAME }}
          DEV_SUPERUSER_PASSWORD: ${{ secrets.DEV_SUPERUSER_PASSWORD }}
        run: sudo docker-compose -f docker-compose.dev.yaml up --build

      # This handles all of our unit tests
      - name: "Run Unit Tests"
        run: sudo docker-compose -f docker-compose.dev.yaml run django_gunicorn pytest

      # This checks syntax and styling standards
      - name: Run Linting
        run: sudo docker-compose -f docker-compose.dev.yaml run django_gunicorn flake8 .

  # GitHub Security Scanning using CodeQL.This checks security vulnerabilities
  security_scan:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    permissions:
      actions: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
